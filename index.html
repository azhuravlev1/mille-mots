<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1000 French words — patterns &amp; forms</title>
<style>:root {
  --ink: #1d1b19;
  --muted: #6d6a64;
  --faint: #a19d95;
  --paper: #ffffff;
  --desk: #e9e6e0;
  --line: #dcd8d0;
  --accent: #2b4c7e;
  --m: #2f6db5;
  --f: #c2416b;
  --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --bar-h: 52px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--desk); }
button, input, select { font: inherit; color: inherit; }

/* ------------------------------------------------------------------ top bar */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(250, 249, 246, .92); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  display: flex; align-items: center; gap: 18px; height: var(--bar-h);
  max-width: 1400px; margin: 0 auto; padding: 0 20px;
}
.brand { font-family: var(--serif); font-size: 20px; font-style: italic; font-weight: 600; color: var(--ink); text-decoration: none; white-space: nowrap; }
.nav { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.nav a {
  padding: 6px 12px; border-radius: 999px; text-decoration: none; color: var(--muted);
  font-size: 14px; white-space: nowrap; transition: background .2s, color .2s;
}
.nav a:hover { background: #ebe7df; color: var(--ink); }
.nav a.active { background: var(--ink); color: #fff; }
.nav a small { opacity: .6; margin-left: 3px; font-size: 11px; }
.top-actions { display: flex; align-items: center; gap: 12px; }
.print-btn {
  border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px;
  font-size: 13px; cursor: pointer;
}
.print-btn:hover { border-color: var(--ink); }

/* pill switch: container + two 50% labels above an absolutely positioned 50% slider */
.mode-switch {
  position: relative; display: flex; flex-direction: row; width: 176px;
  border-radius: 999px; background: #e4e0d8; padding: 0; overflow: hidden;
}
.mode-slider {
  position: absolute; top: 0; left: 0; width: 50%; height: 100%;
  border-radius: 999px; background: var(--ink);
  transform: translateX(0%); transition: transform .35s cubic-bezier(.65, 0, .35, 1);
  box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.mode-switch[data-mode="learn"] .mode-slider { transform: translateX(100%); }
.mode-switch button {
  position: relative; z-index: 1; width: 50%; flex: 0 0 50%;
  background: transparent; border: 0; border-radius: 999px; padding: 7px 0;
  font-size: 13px; font-weight: 600; letter-spacing: .02em; cursor: pointer;
  color: var(--muted); transition: color .35s;
}
.mode-switch button.on { color: #fff; }

.toolbar {
  display: none; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  max-width: 1400px; margin: 0 auto; padding: 8px 20px 10px; font-size: 13px;
}
.toolbar input[type=search] {
  width: 280px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff;
}
.toolbar select { border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; background: #fff; }
.tgl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
.filter-pill {
  background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer;
}
.filter-pill:hover { border-color: var(--ink); }
.known-count { margin-left: auto; color: var(--faint); }

/* ------------------------------------------------------------------ shared word styling */
.hl {
  text-decoration-line: underline; text-decoration-color: var(--c);
  text-decoration-style: var(--s, solid); text-decoration-thickness: 2px;
  text-underline-offset: 2.5px; text-decoration-skip-ink: none;
}
.hl.gap {
  display: inline-block; width: .5em; height: .95em; vertical-align: -0.12em; margin: 0 .5px;
  border-bottom: 2px solid var(--c); border-radius: 2px;
  background: color-mix(in srgb, var(--c) 22%, transparent);
  text-decoration: none;
}
.hl.whole { background: color-mix(in srgb, var(--c) 12%, transparent); border-radius: 2px; }
.stem { text-decoration: underline dotted #8d8a84; text-decoration-thickness: 1.5px; text-underline-offset: 2.5px; }
.hp { background: color-mix(in srgb, var(--c) 28%, transparent) !important; border-radius: 3px; }
.hl.gap.hp { width: .9em; }

.g { display: inline-block; font: 600 .72em/1 var(--sans); padding: .18em .35em; border-radius: 3px; vertical-align: .12em; color: #fff; background: var(--faint); }
.g-m { background: var(--m); }
.g-f { background: var(--f); }
.g-mf { background: linear-gradient(90deg, var(--m) 50%, var(--f) 50%); }
.badge { display: inline-block; font: 600 .66em/1 var(--sans); padding: .22em .4em; border-radius: 3px; border: 1px solid currentColor; vertical-align: .15em; letter-spacing: .02em; white-space: nowrap; }
.b-same { color: #2e7d4f; }
.b-close { color: #4a7d2e; }
.b-faux { color: #c0392b; background: #fdecea; }
.b-ru { color: #7a4fb3; }
.tag { font-size: .72em; color: var(--muted); font-style: italic; }
.rank { font-size: .68em; color: var(--faint); font-variant-numeric: tabular-nums; }
.fw { font-family: var(--serif); font-weight: 700; }
.tr { color: var(--ink); }
.note, .ex, .der, .ru, .rulike, .faux, .pron { color: var(--muted); }
.faux { color: #b03a2e; }
.ex { font-style: italic; }
.ru { color: #6b4aa0; }
.pr { font-family: var(--sans); font-size: .78em; color: var(--muted); margin-left: .35em; letter-spacing: .01em; white-space: nowrap; font-weight: 400; }
.pr b { font-weight: 700; color: #2b4c7e; }
.prkey { border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; margin: 8px 0 0; font-size: .9em; }
.prkey-title { font-weight: 600; margin-bottom: 3px; }
.prkey-title .ln { color: var(--faint); font-weight: 400; font-size: .92em; }
.prkey-cols { display: grid; grid-template-columns: 1fr 1.3fr; gap: 4px 18px; }
.pk { display: inline-block; margin-right: .9em; color: var(--muted); }
.pk b { color: var(--ink); font-family: var(--serif); }
.pk.sp { display: block; }
.pk.sp b { color: #2b4c7e; font-size: 1.1em; }
.mode-learn .prkey { background: #fff; border: 0; border-radius: 14px; padding: 12px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-top: 10px; }
.mode-learn .entry .pr { font-size: .72em; margin-left: 0; }
.say { cursor: pointer; }
.say:hover { color: var(--accent); }
.ext { }
.known-btn { display: none; }

/* ------------------------------------------------------------------ PRINT MODE (screen preview + paper) */
.mode-print main { padding: 24px 12px 60px; }
.mode-print .sheet {
  background: var(--paper); max-width: 210mm; margin: 0 auto; padding: 14mm 12mm;
  box-shadow: 0 2px 18px rgba(0,0,0,.12); font-size: 9pt; line-height: 1.32;
}
.mode-print .ext { display: none; }
.intro h1 { font-family: var(--serif); font-weight: 600; margin: 0 0 2px; font-size: 2.4em; letter-spacing: -.01em; }
.intro .sub { color: var(--muted); margin: 0 0 12px; }
.howto { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 22px; font-size: .92em; margin: 10px 0 4px; }
.howto div { break-inside: avoid; }
.howto b { font-weight: 600; }

.section { margin-top: 1.6em; }
.mode-print .section + .section { break-before: page; }
.sec-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 3px; margin-bottom: 6px; scroll-margin-top: calc(var(--bar-h) + 12px); }
.sec-head h2 { font-family: var(--serif); font-size: 2em; margin: 0; font-weight: 600; }
.sec-head .fr { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 1.15em; }
.sec-head .count { margin-left: auto; color: var(--faint); font-size: .9em; }
.sec-intro { color: var(--muted); margin: 4px 0 8px; }

.legend { border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; margin: 6px 0 10px; font-size: .86em; }
.legend-title { font-weight: 600; font-size: .95em; margin-bottom: 3px; }
.legend-sub { font-weight: 600; color: var(--muted); margin: 5px 0 2px; font-size: .92em; text-transform: uppercase; letter-spacing: .05em; }
.legend-items { column-count: 2; column-gap: 18px; }
.legend-item { display: block; break-inside: avoid; padding: 1px 0; }
.legend-item .sample { font-weight: 700; font-family: var(--serif); display: inline-block; min-width: 3.4em; }
.legend-item .lx { color: var(--faint); font-style: italic; }
.legend-item .ln { color: var(--faint); font-size: .9em; }

.group { margin: 10px 0 4px; }
.group-head { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 4px; break-after: avoid; }
.group-head h3 { font-size: 1.12em; margin: 0; font-weight: 700; }
.group-head .gdesc { color: var(--muted); font-size: .9em; }
.group-head .gcount { color: var(--faint); font-size: .85em; margin-left: auto; }
.subgroup-head { font-size: .95em; font-weight: 600; color: var(--muted); margin: 6px 0 2px; text-transform: uppercase; letter-spacing: .05em; }

/* print: flowing two-column lists */
.mode-print .entries { column-count: 2; column-gap: 7mm; column-rule: 1px solid #eee; }
.mode-print .entry { break-inside: avoid; padding: 1.5px 0; }
.mode-print .entry .hw, .mode-print .entry .tr { display: inline; }
.mode-print .entry .hw::after { content: " — "; color: var(--faint); font-weight: 400; }
.mode-print .entry .more { display: block; padding-left: 1em; font-size: .9em; }
.mode-print .entry .more > * { display: inline; }
.mode-print .entry .more > * + *::before { content: " · "; color: var(--faint); font-style: normal; }
.mode-print .entry .more > .ext { display: none; }
.mode-print .rank { display: none; }

/* verbs */
.mode-print .entries.verbs { column-count: 1; }
.verb .vhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.verb .vhead .fw { font-size: 1.2em; }
.verb .aux { color: var(--muted); font-size: .9em; margin-left: 6px; }
.verb .aux b { color: var(--ink); font-weight: 600; font-family: var(--serif); }
.conj { border-collapse: collapse; width: 100%; table-layout: fixed; margin-top: 2px; }
.conj th { font: 600 .78em/1.1 var(--sans); color: var(--faint); text-align: left; padding: 1px 4px; }
.conj thead th { color: var(--muted); border-bottom: 1px solid var(--line); }
.conj th.rl { width: 11%; font-weight: 500; }
.conj td { padding: 1.5px 4px; font-family: var(--serif); white-space: nowrap; overflow: hidden; text-overflow: clip; }
.conj tbody tr + tr td, .conj tbody tr + tr th { border-top: 1px solid #f1eee8; }
.conj .agr { color: var(--faint); font-size: .85em; }
.conj .aux-f { color: var(--muted); }
.mode-print .verb { break-inside: avoid; padding: 4px 0 5px; border-bottom: 1px solid var(--line); }
.mode-print .conj tr.r-pc { display: none; }
.mode-print .verb .hw::after { content: none; }
.mode-print .verb .more { padding-left: 0; }

/* adjectives */
.adj-cols { display: none; }
.mode-print .entries.adjs { column-count: 1; }
.mode-print .adj, .mode-print .adj-cols { display: grid; grid-template-columns: 23% 12% 12% 12% 41%; column-gap: 0; }
.mode-print .adj { align-items: baseline; border-bottom: 1px solid #f1eee8; padding: 2px 0; }
.mode-print .adj .hw::after { content: none; }
.mode-print .adj .forms4 { display: contents; }
.mode-print .adj .forms4 > span { font-family: var(--serif); grid-row: 1; }
.mode-print .adj .forms4 > span:first-child { display: none; }
.mode-print .adj .hw { grid-column: 1; grid-row: 1; }
.mode-print .adj .tr { grid-column: 1; grid-row: 2; font-size: .92em; color: var(--muted); }
.mode-print .adj .more { grid-column: 5; grid-row: 1 / 3; padding-left: 6px; font-size: .88em; }
.mode-print .adj-cols { font: 600 .75em var(--sans); color: var(--faint); border-bottom: 1px solid var(--line); padding-bottom: 1px; }
.fl { display: none; }

/* other words: paradigms */
.para { font-family: var(--serif); font-weight: 700; }
.para .sep { color: var(--faint); font-weight: 400; margin: 0 .25em; }

/* ------------------------------------------------------------------ LEARN MODE */
.mode-learn { background: #f3f1ec; }
.mode-learn .toolbar { display: flex; }
.mode-learn .print-btn { display: none; }
.mode-learn main { padding: 18px 20px 80px; }
.mode-learn .sheet { max-width: 1400px; margin: 0 auto; font-size: 15px; line-height: 1.45; }
.mode-learn .intro h1 { font-size: 2.6em; }
.mode-learn .howto { grid-template-columns: repeat(3, 1fr); background: #fff; border-radius: 14px; padding: 14px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.mode-learn .section { margin-top: 36px; }
.mode-learn .sec-head { border-bottom-width: 3px; }
.mode-learn .legend { background: #fff; border: 0; border-radius: 14px; padding: 12px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.mode-learn .legend-items { column-count: 3; }
.mode-learn .legend-item { cursor: pointer; border-radius: 6px; padding: 2px 6px; margin: 0 -6px; }
.mode-learn .legend-item:hover { background: #f3f1ec; }
.mode-learn .legend-item.sel { background: color-mix(in srgb, var(--c) 18%, #fff); }
.mode-learn .group-head { margin-top: 22px; }
.mode-learn .group-head h3 { font-size: 1.25em; }
.mode-learn .entries { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
.mode-learn .entries.verbs { grid-template-columns: repeat(auto-fill, minmax(610px, 1fr)); gap: 14px; }
.mode-learn .entry {
  position: relative; background: #fff; border-radius: 12px; padding: 11px 14px 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.03);
  transition: box-shadow .2s, transform .2s;
}
.mode-learn .entry:hover { box-shadow: 0 6px 20px rgba(0,0,0,.09), 0 0 0 1px rgba(0,0,0,.04); }
.mode-learn .entry .hw { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 7px; padding-right: 26px; }
.mode-learn .entry .fw { font-size: 1.3em; }
.mode-learn .entry .tr { display: block; margin-top: 2px; }
.mode-learn .entry .more { display: flex; flex-direction: column; gap: 2px; margin-top: 5px; font-size: .88em; }
.mode-learn .entry.sim-faux { box-shadow: inset 3px 0 0 #c0392b, 0 1px 2px rgba(0,0,0,.06); }
.mode-learn .known-btn {
  display: block; position: absolute; top: 9px; right: 9px; width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; line-height: 1; color: transparent;
}
.mode-learn .known-btn:hover { border-color: #3a9d5d; color: #3a9d5d; }
.mode-learn .entry.known .known-btn { background: #3a9d5d; border-color: #3a9d5d; color: #fff; }
.mode-learn .entry.known { opacity: .6; }
.mode-learn .conj { margin-top: 8px; font-size: .86em; table-layout: auto; }
.mode-learn .conj td { padding: 3px 4px; white-space: normal; line-height: 1.25; }
.mode-learn .conj th.rl { width: 1%; white-space: nowrap; padding-right: 8px; }
.mode-learn .conj tr.ext th { color: #b9b4aa; }
.mode-learn .verb .vhead .fw { font-size: 1.45em; }
.mode-learn .adj .forms4 { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 12px; margin-top: 6px; font-family: var(--serif); font-size: 1.05em; }
.mode-learn .adj .forms4 > span { display: flex; gap: 6px; align-items: baseline; }
.mode-learn .fl { display: inline; font: 600 .62em var(--sans); color: var(--faint); min-width: 2.3em; }
.mode-learn .rank { margin-left: auto; }
.mode-learn .hidden { display: none !important; }
.quiz .entry:not(.reveal) .tr, .quiz .entry:not(.reveal) .more, .quiz .entry:not(.reveal) .conj tbody td {
  filter: blur(6px); user-select: none;
}
.quiz .entry { cursor: pointer; }
.empty-note { color: var(--faint); font-style: italic; padding: 8px 0; }

/* ------------------------------------------------------------------ paper */
@page { size: A4; margin: 11mm 10mm 12mm; }
@media print {
  .topbar { display: none; }
  body, .mode-print, .mode-learn { background: #fff; }
  main { padding: 0 !important; }
  .sheet { box-shadow: none !important; padding: 0 !important; max-width: none !important; font-size: 8.6pt !important; }
  .known-btn { display: none !important; }
  .hidden { display: none !important; }
  a { color: inherit; text-decoration: none; }
}
@media (max-width: 1050px) {
  .nav a small { display: none; }
  .nav a { padding: 6px 9px; }
}
/* Montréal travel course */
.nav a.nav-mtl { color: #1f5fa8; font-weight: 600; }
.nav a.nav-mtl.active { background: #1f5fa8; color: #fff; }
.b-qc { color: #1f5fa8; background: #eaf1fb; }
.role { display: inline-block; font: 700 .6em/1 var(--sans); text-transform: uppercase; letter-spacing: .06em; padding: .3em .45em; border-radius: 3px; margin-right: .45em; vertical-align: .2em; color: #fff; }
.r-say { background: #2e7d4f; }
.r-hear { background: #c77d12; }
.r-sign { background: #6d6a64; }
.mtl .fp { font-family: var(--serif); font-weight: 600; }
.mtl-jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
.mtl-jump a { font-size: .9em; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; background: #fff; }
.mtl-jump a:hover { border-color: #1f5fa8; color: #1f5fa8; }
.mtl-scen { scroll-margin-top: calc(var(--bar-h) + 50px); }
.mtl-intro { margin: 2px 0 4px; }
.mtl-tips { margin: 2px 0 6px; padding-left: 1.2em; color: var(--muted); }
.mtl-tips li { margin: 1px 0; }
.mode-print .mtl .entries.phrases .entry .hw::after { content: " — "; }
.mode-print .mtl-jump { display: none; }
.mode-learn .mtl-intro, .mode-learn .mtl-tips { max-width: 900px; }
.mode-learn .mtl-tips { background: #fff; border-radius: 12px; padding: 10px 14px 10px 30px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.mode-learn .entries.phrases { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
.mode-learn .mtl .entry .fw { font-size: 1.15em; }
.mode-learn .mtl-phrase .fp { font-size: 1.05em; }
.mode-learn .mtl-phrase .hw { display: block; }

summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
.mode-learn details:not([open]) > summary::after { content: " ▸ tap to open"; color: var(--accent); font-weight: 400; font-size: .9em; }
.conj-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
.entry { min-width: 0; }

@media (max-width: 760px) {
  :root { --bar-h: 46px; }
  .brand, .print-btn { display: none; }
  .topbar-inner { gap: 8px; padding: 0 10px; }
  .nav a { padding: 5px 8px; font-size: 13px; }
  .mode-switch { width: 120px; flex: 0 0 120px; }
  .mode-switch button { font-size: 12px; padding: 6px 0; }
  .toolbar { gap: 6px 12px; padding: 4px 10px 6px; font-size: 12px; }
  .toolbar input[type=search] { width: 100%; padding: 6px 12px; }
  .toolbar .tgl:has(#sort), .known-count { display: none; }
  .mode-learn main { padding: 10px 10px 60px; }
  .mode-learn .sheet { font-size: 15px; }
  .mode-learn .intro h1 { font-size: 2em; }
  .mode-learn .entries, .mode-learn .entries.verbs, .mode-learn .entries.phrases { grid-template-columns: 1fr; }
  .mode-learn .mtl-tips { padding-left: 26px; }
  .mode-learn .legend-items, .legend-items { column-count: 1; }
  .mode-learn .howto, .prkey-cols { grid-template-columns: 1fr; }
  .mode-learn .section { margin-top: 24px; }
  .sec-head h2 { font-size: 1.6em; }
  .mode-learn .entry { padding: 10px 12px; }
  .mode-learn .conj { font-size: .82em; min-width: 520px; }
  .mode-learn .conj th.rl { position: sticky; left: 0; background: #fff; z-index: 1; }
  .mode-print main { padding: 8px 0 40px; }
  .mode-print .sheet { padding: 6mm 4mm; }
  .mode-print .entries { column-count: 1; }
}
</style>
</head>
<body class="mode-print">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top">Mille mots</a>
    <nav class="nav" id="nav"></nav>
    <div class="top-actions">
      <button class="print-btn" id="printBtn" title="Print / save as PDF">Print</button>
      <div class="mode-switch" id="modeSwitch" data-mode="print" role="tablist" aria-label="View mode">
        <span class="mode-slider" aria-hidden="true"></span>
        <button role="tab" data-mode="print">Print</button>
        <button role="tab" data-mode="learn">Learn</button>
      </div>
    </div>
  </div>
  <div class="toolbar" id="toolbar">
    <input id="search" type="search" placeholder="Search French or English…" autocomplete="off">
    <label class="tgl"><input type="checkbox" id="quiz"> Quiz: hide translations</label>
    <label class="tgl"><input type="checkbox" id="hideKnown"> Hide words I know</label>
    <label class="tgl">Sort
      <select id="sort"><option value="rank">by frequency</option><option value="alpha">A → Z</option></select>
    </label>
    <span class="filter-pill" id="filterPill" hidden></span>

<script id="data" type="application/json">{"sections":{"other":[{"lem":"de","w":"de","rank":1,"en":"of; from; (some, after negation)","sim":"none","pr":"duh","note":"Also used after negation instead of un/du: je n'ai pas de pain. Becomes d' before a vowel.","ex":"Le livre de Marie. — Marie's book.","cls":"preposition","sub":"origin/possession","head":[["de",""]],"pats":[]},{"lem":"je","w":"je","rank":3,"en":"I","sim":"none","pr":"zhuh","note":"Becomes j' before a vowel or mute h: j'ai.","ex":"Je suis fatigué. — I am tired.","cls":"pronoun","sub":"subject","head":[["je",""]],"pats":[]},{"lem":"et","w":"et","rank":5,"en":"and","sim":"none","pr":"ay","ex":"Du pain et du vin. — Bread and wine.","cls":"conjunction","sub":"coordinating","head":[["et",""]],"pats":[]},{"lem":"le","w":"le / la / les","rank":6,"en":"the; (pron.) him, her, it, them","sim":"none","pr":"luh","note":"le/la → l' before a vowel. As object pronoun: je le vois = I see him/it.","ex":"Le chat et la maison. — The cat and the house.","cls":"article","sub":"definite","forms":{"ms":"le","fs":"la","mp":"les","fp":"les"},"head":[["le / la / les",""]],"pats":[]},{"lem":"à","w":"à","rank":7,"en":"to; at; in (a city)","sim":"none","pr":"a","note":"à + le = au, à + les = aux. Also marks purpose/feature: une tasse à café (coffee cup).","ex":"Je vais à Paris. — I'm going to Paris.","cls":"preposition","sub":"place","head":[["à",""]],"pats":[]},{"lem":"il","w":"il","rank":9,"en":"he; it","sim":"none","pr":"eel","note":"Also the impersonal 'it': il pleut (it's raining), il faut (one must).","ex":"Il fait froid. — It's cold.","cls":"pronoun","sub":"subject","head":[["il",""]],"pats":[]},{"lem":"un","w":"un / une / des","rank":11,"en":"a, an; one; (pl.) some","sim":"none","pr":"ẽ","note":"Also the number one. Plural des = 'some', often left untranslated.","ex":"J'ai un frère et une sœur. — I have a brother and a sister.","cls":"article","sub":"indefinite","forms":{"ms":"un","fs":"une","mp":"des","fp":"des"},"head":[["un / une / des",""]],"pats":[]},{"lem":"tu","w":"tu","rank":12,"en":"you (informal, singular)","sim":"none","pr":"tü","note":"Only for one person you know well, children, family. Otherwise use vous.","ru":"ты","ex":"Tu viens ce soir ? — Are you coming tonight?","cls":"pronoun","sub":"subject","head":[["tu",""]],"pats":[]},{"lem":"vous","w":"vous","rank":13,"en":"you (polite or plural)","sim":"none","pr":"voo","note":"Both formal singular 'you' and plural 'you all'. Also object: je vous aime.","ru":"вы (вежл./мн.)","ex":"Vous êtes prêts ? — Are you (all) ready?","cls":"pronoun","sub":"subject","head":[["vous",""]],"pats":[]},{"lem":"en","w":"en","rank":14,"en":"in; to; by (+ -ant); of it, some (pron.)","sim":"none","pr":"ã","note":"Preposition (en France, en été, en train) AND pronoun replacing de + noun: j'en veux = I want some.","ru":"(мест.) его/их/этого; оттуда","ex":"J'en ai deux. — I have two (of them).","cls":"preposition","sub":"place/time","head":[["en",""]],"pats":[]},{"lem":"qui","w":"qui","rank":16,"en":"who; whom; which, that","sim":"none","pr":"kee","note":"Relative subject 'who/which/that' for people and things: le livre qui est là.","ex":"Qui est là ? — Who's there?","cls":"pronoun","sub":"interrogative/relative","head":[["qui",""]],"pats":[]},{"lem":"on","w":"on","rank":17,"en":"we (colloquial); one; people, someone","sim":"faux","pr":"õ","note":"Always takes a 3rd-person singular verb. In speech it usually means 'we'.","ru":"«мы / кто-то», безличное","faux":"≠ on — it's a pronoun: we / one / people","ex":"On y va ? — Shall we go?","cls":"pronoun","sub":"subject (indefinite)","head":[["on",""]],"pats":[]},{"lem":"pour","w":"pour","rank":18,"en":"for; in order to","sim":"faux","pr":"poor","faux":"≠ pour — means for","ex":"C'est pour toi. — It's for you.","cls":"preposition","sub":"purpose","head":[["pour",""]],"pats":[]},{"lem":"dans","w":"dans","rank":19,"en":"in, inside; in (time from now)","sim":"none","pr":"dã","note":"dans une heure = in an hour (from now); en une heure = within an hour.","ex":"Il est dans la cuisine. — He's in the kitchen.","cls":"preposition","sub":"place","head":[["dans",""]],"pats":[]},{"lem":"elle","w":"elle","rank":21,"en":"she; it; her (stressed)","sim":"none","pr":"ehl","note":"'It' for feminine nouns: la table → elle.","ex":"Elle est médecin. — She is a doctor.","cls":"pronoun","sub":"subject/stressed","head":[["elle",""]],"pats":[]},{"lem":"ça","w":"ça","rank":22,"en":"that, this, it","sim":"none","pr":"sa","note":"Informal form of cela. Ça va ? = How are you? / Is it OK?","ex":"Ça coûte combien ? — How much is that?","cls":"pronoun","sub":"demonstrative","head":[["ça",""]],"pats":[]},{"lem":"du","w":"du / de la / des","rank":23,"en":"some, any; of the, from the","sim":"none","pr":"dü","note":"Partitive article (du pain = some bread). Also the contraction de + le = du, de + les = des.","ex":"Je bois du café. — I drink (some) coffee.","cls":"article","sub":"partitive/contracted","forms":{"ms":"du","fs":"de la","mp":"des","fp":"des"},"head":[["du / de la / des",""]],"pats":[]},{"lem":"mais","w":"mais","rank":25,"en":"but","sim":"none","pr":"meh","ex":"C'est cher, mais bon. — It's expensive, but good.","cls":"conjunction","sub":"coordinating","head":[["mais",""]],"pats":[]},{"lem":"se","w":"se","rank":26,"en":"oneself; himself, herself, themselves; each other","sim":"none","pr":"suh","note":"Reflexive pronoun of pronominal verbs: se laver = to wash (oneself). Becomes s' before a vowel.","ru":"себя / -ся","ex":"Ils se parlent. — They talk to each other.","cls":"pronoun","sub":"reflexive","head":[["se",""]],"pats":[]},{"lem":"me","w":"me","rank":27,"en":"me; to me; myself","sim":"same","pr":"muh","note":"Object/reflexive pronoun before the verb; becomes m' before a vowel. After the verb use moi.","ex":"Il me regarde. — He's looking at me.","cls":"pronoun","sub":"object/reflexive","head":[["me",""]],"pats":[]},{"lem":"au","w":"au / à la / aux","rank":29,"en":"to the; at the; in the","sim":"none","pr":"oh","note":"Contraction: à + le = au, à + les = aux. No contraction with la or l': à la gare, à l'école.","ex":"Je vais au cinéma. — I'm going to the cinema.","cls":"article","sub":"contracted","forms":{"ms":"au","fs":"à la","mp":"aux","fp":"aux"},"head":[["au / à la / aux",""]],"pats":[]},{"lem":"nous","w":"nous","rank":30,"en":"we; us; ourselves","sim":"none","pr":"noo","note":"Subject, object and stressed form. In speech 'we' is often on.","ex":"Nous partons demain. — We're leaving tomorrow.","cls":"pronoun","sub":"subject/object","head":[["nous",""]],"pats":[]},{"lem":"ce","w":"ce / cet / cette / ces","rank":32,"en":"this, that; these, those; it (c'est)","sim":"none","pr":"seu","note":"cet before a masculine vowel: cet homme. Add -ci/-là to contrast: ce livre-ci. Also pronoun: c'est, ce que.","ex":"Cette maison est belle. — This house is beautiful.","cls":"determiner","sub":"demonstrative","forms":{"ms":"ce","fs":"cette","mp":"ces","fp":"ces","ms2":"cet"},"head":[["ce / cet / cette / ces",""]],"pats":[]},{"lem":"sur","w":"sur","rank":33,"en":"on; about; out of (ratio)","sim":"none","pr":"sür","note":"un livre sur Paris = a book about Paris; un sur dix = one out of ten.","ex":"Le livre est sur la table. — The book is on the table.","cls":"preposition","sub":"place","head":[["sur",""]],"pats":[]},{"lem":"avec","w":"avec","rank":34,"en":"with","sim":"none","pr":"a·vehk","ex":"Je viens avec toi. — I'm coming with you.","cls":"preposition","sub":"accompaniment","head":[["avec",""]],"pats":[]},{"lem":"y","w":"y","rank":35,"en":"there; (about/to) it","sim":"none","pr":"ee","note":"Replaces à + place or à + thing: j'y vais = I'm going (there); j'y pense = I think about it.","ru":"туда / там; об этом","ex":"Il y a un problème. — There is a problem.","cls":"pronoun","sub":"adverbial","head":[["y",""]],"pats":[]},{"lem":"que","w":"que","rank":36,"en":"that; what; which, whom; than","sim":"none","pr":"kuh","note":"Also the conjunction 'that' (je sais que…) and 'than' in comparisons (plus grand que). Becomes qu' before a vowel.","ex":"Que veux-tu ? — What do you want?","cls":"pronoun","sub":"interrogative/relative","head":[["que",""]],"pats":[]},{"lem":"lui","w":"lui","rank":39,"en":"him; (to) him, (to) her","sim":"none","pr":"lüee","note":"Before the verb it means 'to him OR to her': je lui parle. As stressed form = him: avec lui.","ru":"ему / ей; он (ударн.)","ex":"Je lui donne le livre. — I give him/her the book.","cls":"pronoun","sub":"indirect object/stressed","head":[["lui",""]],"pats":[]},{"lem":"son","w":"son / sa / ses","rank":42,"en":"his, her, its; their (one's)","sim":"faux","pr":"sõ","note":"Agrees with the thing owned, not the owner: sa voiture = his OR her car. son before feminine vowel: son amie.","faux":"≠ son — means his/her","ex":"Il aime sa mère. — He loves his mother.","cls":"determiner","sub":"possessive","forms":{"ms":"son","fs":"sa","mp":"ses","fp":"ses"},"head":[["son / sa / ses",""]],"pats":[]},{"lem":"mon","w":"mon / ma / mes","rank":43,"en":"my","sim":"none","pr":"mõ","note":"mon is used before a feminine noun starting with a vowel: mon amie, mon école.","ex":"C'est ma sœur. — This is my sister.","cls":"determiner","sub":"possessive","forms":{"ms":"mon","fs":"ma","mp":"mes","fp":"mes"},"head":[["mon / ma / mes",""]],"pats":[]},{"lem":"ils","w":"ils","rank":45,"en":"they (m. or mixed)","sim":"none","pr":"eel","note":"Used for a group of all-masculine or mixed nouns/people; elles only for all-feminine.","ex":"Ils sont partis. — They left.","cls":"pronoun","sub":"subject","head":[["ils",""]],"pats":[]},{"lem":"comme","w":"comme","rank":46,"en":"like, as; since; how (!)","sim":"none","pr":"kom","note":"comme ça = like that; comme il pleut… = since it's raining; Comme c'est beau ! = How beautiful!","ex":"Il parle comme son père. — He talks like his father.","cls":"conjunction","sub":"comparison","head":[["comme",""]],"pats":[]},{"lem":"moi","w":"moi","rank":47,"en":"me; I (stressed)","sim":"none","pr":"mwa","note":"Stressed form: after prepositions, alone, for emphasis: moi, je… ; donne-moi.","ex":"C'est pour moi ? — Is it for me?","cls":"pronoun","sub":"stressed","head":[["moi",""]],"pats":[]},{"lem":"par","w":"par","rank":48,"en":"by; through; per","sim":"none","pr":"par","note":"par jour = per day; par la fenêtre = through the window; par exemple = for example.","ex":"Il passe par Lyon. — He goes through Lyon.","cls":"preposition","sub":"means/place","head":[["par",""]],"pats":[]},{"lem":"te","w":"te","rank":50,"en":"you; to you; yourself (informal)","sim":"none","pr":"tuh","note":"Object/reflexive form of tu; becomes t' before a vowel. After the verb use toi.","ex":"Je te vois. — I see you.","cls":"pronoun","sub":"object/reflexive","head":[["te",""]],"pats":[]},{"lem":"où","w":"où","rank":53,"en":"where; when (relative)","sim":"none","pr":"oo","note":"Also 'when' after time words: le jour où je suis né. Don't confuse with ou (or).","ex":"Où est la gare ? — Where is the station?","cls":"pronoun","sub":"interrogative/relative","head":[["où",""]],"pats":[]},{"lem":"ou","w":"ou","rank":54,"en":"or","sim":"none","pr":"oo","note":"No accent = 'or'; où with accent = 'where'. ou… ou = either… or.","ex":"Thé ou café ? — Tea or coffee?","cls":"conjunction","sub":"coordinating","head":[["ou",""]],"pats":[]},{"lem":"rien","w":"rien","rank":55,"en":"nothing; anything","sim":"none","pr":"ryẽ","note":"Used with ne: je ne vois rien. De rien = you're welcome.","ex":"Je n'ai rien dit. — I said nothing.","cls":"pronoun","sub":"indefinite (negative)","head":[["rien",""]],"pats":[]},{"lem":"quand","w":"quand","rank":58,"en":"when","sim":"none","pr":"kã","ex":"Quand il pleut, je reste. — When it rains, I stay.","cls":"conjunction","sub":"subordinating (time)","head":[["quand",""]],"pats":[]},{"lem":"sans","w":"sans","rank":59,"en":"without","sim":"none","pr":"sã","ex":"Un café sans sucre. — A coffee without sugar.","cls":"preposition","sub":"manner","head":[["sans",""]],"pats":[]},{"lem":"toi","w":"toi","rank":64,"en":"you (stressed, informal)","sim":"none","pr":"twa","note":"Stressed form of tu: avec toi, et toi ?, assieds-toi.","ex":"Et toi, ça va ? — And you, how are you?","cls":"pronoun","sub":"stressed","head":[["toi",""]],"pats":[]},{"lem":"deux","w":"deux","rank":75,"en":"two","sim":"none","pr":"deu","ex":"Deux cafés, s'il vous plaît. — Two coffees, please.","cls":"number","sub":"cardinal","head":[["deux",""]],"pats":[]},{"lem":"votre","w":"votre / vos","rank":82,"en":"your (polite or plural)","sim":"none","pr":"votr","ex":"Votre nom, s'il vous plaît ? — Your name, please?","cls":"determiner","sub":"possessive","forms":{"ms":"votre","fs":"votre","mp":"vos","fp":"vos"},"head":[["votre / vos",""]],"pats":[]},{"lem":"ton","w":"ton / ta / tes","rank":94,"en":"your (informal, singular)","sim":"faux","pr":"tõ","note":"ton is used before a feminine noun starting with a vowel: ton amie.","faux":"≠ ton — means your","ex":"C'est ton livre ? — Is that your book?","cls":"determiner","sub":"possessive","forms":{"ms":"ton","fs":"ta","mp":"tes","fp":"tes"},"head":[["ton / ta / tes",""]],"pats":[]},{"lem":"notre","w":"notre / nos","rank":103,"en":"our","sim":"none","pr":"notr","ex":"Notre maison est petite. — Our house is small.","cls":"determiner","sub":"possessive","forms":{"ms":"notre","fs":"notre","mp":"nos","fp":"nos"},"head":[["notre / nos",""]],"pats":[]},{"lem":"chez","w":"chez","rank":117,"en":"at (someone's place); to (someone's)","sim":"none","pr":"shay","note":"chez moi = at/to my place, home; chez le médecin = at the doctor's.","ru":"у (кого-то)","ex":"Viens chez moi. — Come to my place.","cls":"preposition","sub":"place","head":[["chez",""]],"pats":[]},{"lem":"quelque","w":"quelque","rank":124,"en":"some; (pl.) a few","sim":"none","pr":"kehlk","note":"Mostly plural: quelques amis = a few friends. See also quelqu'un, quelque chose.","ex":"J'ai quelques questions. — I have a few questions.","cls":"determiner","sub":"indefinite","head":[["quelque",""]],"pats":[]},{"lem":"après","w":"après","rank":126,"en":"after; afterwards","sim":"none","pr":"a·preh","ex":"On se voit après le dîner. — See you after dinner.","cls":"preposition","sub":"time","head":[["après",""]],"pats":[]},{"lem":"sous","w":"sous","rank":130,"en":"under, beneath","sim":"none","pr":"soo","ex":"Le chat est sous le lit. — The cat is under the bed.","cls":"preposition","sub":"place","head":[["sous",""]],"pats":[]},{"lem":"cela","w":"cela","rank":140,"en":"that, this, it","sim":"none","pr":"suh·la","note":"Formal/written form of ça.","ex":"Cela ne me plaît pas. — I don't like that.","cls":"pronoun","sub":"demonstrative","head":[["cela",""]],"pats":[]},{"lem":"entre","w":"entre","rank":141,"en":"between; among","sim":"none","pr":"ãtr","ex":"Entre nous, c'est nul. — Between us, it's bad.","cls":"preposition","sub":"place","head":[["entre",""]],"pats":[]},{"lem":"vers","w":"vers","rank":143,"en":"toward(s); around (time)","sim":"none","pr":"vehr","note":"vers midi = around noon. Le vers (noun) = line of verse.","ex":"Il marche vers la gare. — He walks toward the station.","cls":"preposition","sub":"direction","head":[["vers",""]],"pats":[]},{"lem":"dont","w":"dont","rank":144,"en":"of which, whose, of whom","sim":"none","pr":"dõ","note":"Replaces de + noun in relative clauses: l'homme dont je parle = the man I'm talking about.","ru":"о котором / чей","ex":"Le livre dont j'ai besoin. — The book I need.","cls":"pronoun","sub":"relative","head":[["dont",""]],"pats":[]},{"lem":"avant","w":"avant","rank":151,"en":"before","sim":"none","pr":"a·vã","note":"avant = before (time); devant = in front of (place). avant de + infinitive: avant de partir.","ex":"Appelle-moi avant midi. — Call me before noon.","cls":"preposition","sub":"time","head":[["avant",""]],"pats":[]},{"lem":"oh","w":"oh","rank":154,"en":"oh","sim":"same","pr":"oh","ex":"Oh, c'est joli ! — Oh, that's pretty!","cls":"interjection","sub":"exclamation","head":[["oh",""]],"pats":[]},{"lem":"puis","w":"puis","rank":155,"en":"then, next","sim":"none","pr":"püee","ex":"Il mange, puis il part. — He eats, then leaves.","cls":"conjunction","sub":"sequence","head":[["puis",""]],"pats":[]},{"lem":"donc","w":"donc","rank":159,"en":"so, therefore; (emphatic) then","sim":"none","pr":"dõk","note":"Also emphatic in speech: Viens donc ! = Do come!","ex":"Je pense, donc je suis. — I think, therefore I am.","cls":"conjunction","sub":"consequence","head":[["donc",""]],"pats":[]},{"lem":"voilà","w":"voilà","rank":160,"en":"there is/are; here is; that's it","sim":"same","pr":"vwa·la","note":"Points to something: voilà le bus. Also 'that's it' and 'ago' (voilà deux ans).","ru_like":"вуаля","ex":"Voilà ton café. — Here's your coffee.","cls":"preposition","sub":"presentative","head":[["voilà",""]],"pats":[]},{"lem":"trois","w":"trois","rank":163,"en":"three","sim":"none","pr":"trwa","ex":"Trois enfants. — Three children.","cls":"number","sub":"cardinal","head":[["trois",""]],"pats":[]},{"lem":"ni","w":"ni","rank":164,"en":"nor; neither… nor (ni… ni)","sim":"none","pr":"nee","note":"Used with ne: je n'aime ni le thé ni le café.","ex":"Ni oui ni non. — Neither yes nor no.","cls":"conjunction","sub":"coordinating (negative)","head":[["ni",""]],"pats":[]},{"lem":"depuis","w":"depuis","rank":166,"en":"since; for (duration up to now)","sim":"none","pr":"duh·püee","note":"Takes the present tense: j'habite ici depuis 2 ans = I have lived here for 2 years.","ex":"Je t'attends depuis une heure. — I've been waiting an hour.","cls":"preposition","sub":"time","head":[["depuis",""]],"pats":[]},{"lem":"elles","w":"elles","rank":167,"en":"they (f.); them (stressed)","sim":"none","pr":"ehl","note":"Only for all-feminine groups; a mixed group takes ils.","ex":"Elles sont sœurs. — They are sisters.","cls":"pronoun","sub":"subject/stressed","head":[["elles",""]],"pats":[]},{"lem":"merci","w":"merci","rank":169,"en":"thank you, thanks","sim":"faux","pr":"mehr·see","note":"Merci beaucou rees","n":2,"ex":["grand-père → grands-pères","grand-mère → grands-mères"],"color":"#2e8b57","style":"solid"},{"id":77,"sec":"verb","key":"pre:pour","label":"pour-","desc":"prefix pour-","n":1,"ex":["poursuivre"],"color":"#3cb44b","style":"double"},{"id":78,"sec":"adj","key":"suf:eux","label":"-eux","desc":"suffix -eux","n":2,"ex":["amoureux","dangereux"],"color":"#d6249f","style":"solid"},{"id":79,"sec":"adj","key":"fem:gap","label":"∅ (unchanged)","desc":"feminine: nothing added where +e is expected","n":1,"ex":["super → super"],"color":"#4363d8","style":"double"},{"id":80,"sec":"adj","key":"pl:gap","label":"∅ (unchanged)","desc":"plural: nothing added where +s is expected","n":1,"ex":["super → super"],"color":"#f58231","style":"double"},{"id":81,"sec":"adj","key":"fpl:gap","label":"∅ (unchanged)","desc":"feminine plural: nothing added where +s is expected","n":1,"ex":["super → super"],"color":"#911eb4","style":"double"},{"id":82,"sec":"adj","key":"fem:ais→aîche","label":"-ais → -aîche","desc":"feminine: -ais becomes -aîche","n":1,"ex":["frais → fraîche"],"color":"#0fa3b1","style":"double"},{"id":83,"sec":"adj","key":"pl:ial→iaux","label":"-ial → -iaux","desc":"plural: -ial becomes -iaux","n":1,"ex":["génial → géniaux"],"color":"#d6249f","style":"double"},{"id":84,"sec":"adj","key":"suf:ain","label":"-ain","desc":"suffix -ain","n":1,"ex":["américain"],"color":"#8aa100","style":"double"}],"persons":["je","tu","il/elle","nous","vous","ils/elles"],"stats":{"other":111,"verb":301,"adv":74,"adj":95,"noun":419,"mtl":237},"montreal":[{"id":"qc","title":"Québec French survival kit","sub":"what is different from textbook French","intro":"Montreal is bilingual, but start every exchange with \"Bonjour\": it is polite and people often answer \"Bonjour-Hi\" so you can choose. Québécois switch to \"tu\" quickly; answering with \"tu\" is fine with people your age.","tips":["Meals shift one step: déjeuner = breakfast, dîner = lunch, souper = dinner.","Prices on tags exclude tax (about 15 % is added at the till). Tip 15–20 % in restaurants and bars; card terminals ask you to pick the percentage.","Times are written on the 24-hour clock: 19 h 30 = 7:30 pm, said \"dix-neuf heures trente\".","Accent: \"tu\" and \"di\" sound like \"tsu\" and \"dzi\" (tu dis → tsu dzi), and \"moi\" can sound like \"mwé\". Don't be thrown by it."],"blocks":[{"title":"Words that differ in Québec","kind":"words","items":[{"f":"le dépanneur","e":"corner store (open late; snacks, drinks)","n":"Often shortened to « le dép ».","qc":true,"pr":"luh day·pa·neur"},{"f":"le déjeuner","e":"breakfast","n":"In France: lunch.","qc":true,"pr":"luh day·zheu·nay"},{"f":"le dîner","e":"lunch","n":"In France: dinner.","qc":true,"pr":"luh dee·nay"},{"f":"le souper","e":"dinner, supper","qc":true,"pr":"luh soo·pay"},{"f":"la fin de semaine","e":"weekend","n":"France says « le week-end ».","qc":true,"pr":"la fẽ duh suh·mehn"},{"f":"magasiner","e":"to go shopping","qc":true,"pr":"ma·ga·zee·nay"},{"f":"la piastre","e":"dollar (colloquial)","n":"Pronounced « piasse ». Also « une cenne » = a cent.","qc":true,"pr":"la pyas"},{"f":"la liqueur","e":"soft drink, pop","n":"Faux ami! Not liquor (= alcool, spiritueux).","qc":true,"faux":true,"pr":"la lee·keur"},{"f":"le breuvage","e":"drink, beverage","qc":true,"pr":"luh breu·vazh"},{"f":"pour emporter","e":"to go, take-away","n":"« Pour ici ou pour emporter ? » = for here or to go?","pr":"poor ã·por·tay"},{"f":"l'addition","e":"the bill (restaurant)","n":"In Québec you'll also hear « la facture ».","pr":"la·dee·syõ"},{"f":"le pourboire","e":"tip","pr":"luh poor·bwar"},{"f":"le char","e":"car (colloquial)","qc":true,"pr":"luh shar"},{"f":"le chum","e":"boyfriend; buddy","n":"« Ma blonde » = my girlfriend.","qc":true,"pr":"luh chom"},{"f":"la tuque","e":"winter hat, beanie","qc":true,"pr":"la tük"},{"f":"frette","e":"freezing cold (colloquial froid)","qc":true,"pr":"freht"},{"f":"tantôt","e":"a little while ago / in a little while","n":"Context decides: « à tantôt » = see you later.","qc":true,"pr":"tã·toh"},{"f":"c'est plate","e":"it's boring, it's a shame","qc":true,"pr":"cay plat"}]},{"title":"Everyday phrases","kind":"phrases","items":[{"f":"Bonjour !","e":"Hello (any time until evening)","r":"say"},{"f":"Bonsoir !","e":"Good evening","r":"say"},{"f":"Allô !","e":"Hi! (casual, also on the phone)","r":"hear","qc":true},{"f":"Merci beaucoup !","e":"Thanks a lot","r":"say"},{"f":"Bienvenue !","e":"You're welcome","r":"hear","n":"Québec reply to merci (France: de rien).","qc":true},{"f":"Pas de trouble.","e":"No problem.","r":"hear","qc":true},{"f":"C'est correct.","e":"It's OK / that's fine.","r":"hear","qc":true},{"f":"Excusez-moi, est-ce que vous parlez anglais ?","e":"Excuse me, do you speak English?","r":"say"},{"f":"Pouvez-vous répéter plus lentement, s'il vous plaît ?","e":"Can you repeat more slowly, please?","r":"say"},{"f":"Je ne comprends pas.","e":"I don't understand.","r":"say"},{"f":"Je suis désolé(e), je parle un peu français.","e":"Sorry, I speak a little French.","r":"say"},{"f":"Où sont les toilettes ?","e":"Where are the restrooms?","r":"say","n":"Also « la salle de bain »."},{"f":"C'est combien ?","e":"How much is it?","r":"say"},{"f":"Débit ou crédit ?","e":"Debit or credit?","r":"hear"},{"f":"Voulez-vous votre reçu ?","e":"Do you want your receipt?","r":"hear"},{"f":"Pour ici ou pour emporter ?","e":"For here or to go?","r":"hear"},{"f":"Bonne journée ! / Bonne soirée !","e":"Have a good day / evening!","r":"hear"}]}]},{"id":"train","title":"Train station","sub":"Gare Centrale, VIA Rail and commuter trains","intro":"Montreal's main station is Gare Centrale (VIA Rail intercity trains and exo commuter trains), connected underground to Bonaventure metro (orange line). Watch the departures board: look for your train number, the destination, and the track.","tips":["On a train, « une voiture » is a carriage, not a car. Your ticket shows voiture + place (seat).","« À l'heure » = on time; « retardé » = delayed; « annulé » = cancelled.","Have your ticket and photo ID ready at boarding: « billet et pièce d'identité »."],"blocks":[{"title":"Key words","kind":"words","items":[{"f":"la gare","e":"train station","pr":"la gar"},{"f":"le train","e":"train","pr":"luh trẽ"},{"f":"le billet","e":"ticket","pr":"luh bee·yeh"},{"f":"un aller simple","e":"one-way ticket","pr":"ẽn a·lay sẽpl"},{"f":"un aller-retour","e":"return / round-trip ticket","pr":"ẽn a·lay·ruh·toor"},{"f":"les départs","e":"departures","pr":"leh day·par"},{"f":"les arrivées","e":"arrivals","pr":"lehz a·ree·vay"},{"f":"la voie","e":"track (where the train leaves from)","pr":"la vwa"},{"f":"le quai","e":"platform","pr":"luh keh"},{"f":"la voiture","e":"train carriage, car","n":"On a train, not an automobile.","pr":"la vwa·tür"},{"f":"la place","e":"seat (reserved)","n":"Also « le siège » = the seat itself.","pr":"la plas"},{"f":"l'embarquement","e":"boarding","pr":"lã·bar·kuh·mã"},{"f":"le retard","e":"delay","faux":true,"n":"Faux ami: means delay, nothing else.","pr":"luh ruh·tar"},{"f":"annulé","e":"cancelled","pr":"a·nü·lay"},{"f":"la correspondance","e":"connection, transfer","faux":true,"n":"Not letters: a change between trains/lines.","pr":"la koh·rehs·põ·dãs"},{"f":"le guichet","e":"ticket counter, window","pr":"luh gee·sheh"},{"f":"la billetterie automatique","e":"ticket machine","pr":"la bee·yeh·tuh·ree oh·toh·ma·teek"},{"f":"la consigne","e":"left-luggage, lockers","pr":"la kõ·seeny"},{"f":"les bagages","e":"luggage","pr":"leh ba·gazh"},{"f":"le contrôleur","e":"ticket inspector, conductor","pr":"luh kõ·troh·leur"},{"f":"la sortie","e":"exit","pr":"la sor·tee"}]},{"title":"You'll hear (announcements)","kind":"phrases","items":[{"f":"Le train numéro 64 à destination de Toronto partira de la voie 15.","e":"Train number 64 to Toronto will leave from track 15.","r":"hear"},{"f":"L'embarquement commencera dans dix minutes.","e":"Boarding will begin in ten minutes.","r":"hear"},{"f":"Veuillez avoir votre billet et une pièce d'identité en main.","e":"Please have your ticket and a photo ID in hand.","r":"hear","n":"« Veuillez… » = please… (formal, used in all announcements)."},{"f":"Le train en provenance d'Ottawa arrive en retard d'environ vingt minutes.","e":"The train from Ottawa is arriving about 20 minutes late.","r":"hear","n":"en provenance de = coming from; à destination de = going to."},{"f":"Nous nous excusons pour ce retard.","e":"We apologize for this delay.","r":"hear"},{"f":"Prochain arrêt : Dorval.","e":"Next stop: Dorval.","r":"hear"},{"f":"Votre billet, s'il vous plaît.","e":"Your ticket, please.","r":"hear"}]},{"title":"You'll say","kind":"phrases","items":[{"f":"Un aller simple pour Québec, s'il vous plaît.","e":"A one-way ticket to Québec City, please.","r":"say"},{"f":"Le train pour Toronto part de quelle voie ?","e":"Which track does the Toronto train leave from?","r":"say"},{"f":"Est-ce que le train est à l'heure ?","e":"Is the train on time?","r":"say"},{"f":"Excusez-moi, je pense que c'est ma place.","e":"Excuse me, I think this is my seat.","r":"say"},{"f":"Où est la station de métro ?","e":"Where is the metro station?","r":"say"}]},{"title":"You'll see (signs)","kind":"phrases","items":[{"f":"Départs / Arrivées","e":"Departures / Arrivals","r":"see"},{"f":"À l'heure · Retardé · Annulé","e":"On time · Delayed · Cancelled","r":"see"},{"f":"Embarquement","e":"Boarding","r":"see"},{"f":"Accès aux quais","e":"To the platforms","r":"see"},{"f":"Billets","e":"Tickets","r":"see"},{"f":"Métro Bonaventure","e":"Way to Bonaventure metro station","r":"see"}]}]},{"id":"metro","title":"Montreal metro (STM)","sub":"lines, announcements, buying fares","intro":"Four lines, named by colour: verte (green, Angrignon ↔ Honoré-Beaugrand), orange (Côte-Vertu ↔ Montmorency), jaune (yellow, Berri-UQAM ↔ Longueuil) and bleue (blue, Snowdon ↔ Saint-Michel). Direction signs show the END station of the line, so know which terminus you are heading towards. Announcements are in French.","tips":["Find your direction by the last station: « Direction Montmorency » means the orange line towards Montmorency.","Big transfer stations: Berri-UQAM (green/orange/yellow), Lionel-Groulx (green/orange), Snowdon and Jean-Talon (orange/blue).","In announcements listen for three words: « prochaine station » (next station), « correspondance » (transfer) and « interruption » / « ralentissement » (service down / slowed)."],"blocks":[{"title":"Key words","kind":"words","items":[{"f":"le métro","e":"subway, metro","pr":"luh may·troh"},{"f":"la station","e":"metro station","n":"« La gare » is for trains, « la station » for the metro.","pr":"la sta·syõ"},{"f":"la ligne","e":"line (verte, orange, jaune, bleue)","pr":"la leeny"},{"f":"la direction","e":"direction (= the end station of the line)","pr":"la dee·rehk·syõ"},{"f":"la correspondance","e":"transfer to another line","pr":"la koh·rehs·põ·dãs"},{"f":"le quai","e":"platform","pr":"luh keh"},{"f":"la rame","e":"train (the set of metro cars)","pr":"la ram"},{"f":"le titre de transport","e":"fare, ticket (any type)","n":"Official STM word for tickets and passes.","pr":"luh teetr duh trãs·por"},{"f":"la carte OPUS","e":"OPUS card (rechargeable transit card)","pr":"la kart oh·püs"},{"f":"le passage","e":"a single ride (on a fare card)","pr":"luh pa·sazh"},{"f":"la distributrice","e":"vending / ticket machine","qc":true,"pr":"la dees·tree·bü·trees"},{"f":"le tourniquet","e":"turnstile","pr":"luh toor·nee·keh"},{"f":"valider","e":"to tap / validate your card","pr":"va·lee·day"},{"f":"l'interruption de service","e":"service stoppage","pr":"lẽ·teh·rüp·syõ duh sehr·vees"},{"f":"le ralentissement","e":"slowdown","pr":"luh ra·lã·tee·suh·mã"},{"f":"la reprise","e":"resumption (of service)","pr":"la ruh·preez"},{"f":"la navette","e":"shuttle (replacement bus)","pr":"la na·veht"},{"f":"l'autobus","e":"bus","n":"Québec says « l'autobus » more than « le bus ».","pr":"loh·toh·büs"},{"f":"l'arrêt","e":"stop (bus stop)","pr":"la·reh"},{"f":"l'escalier mécanique","e":"escalator","n":"Also « l'escalier roulant ».","pr":"lehs·ka·lyay may·ka·neek"},{"f":"l'ascenseur","e":"elevator","pr":"la·sã·seur"}]},{"title":"You'll hear (announcements)","kind":"phrases","items":[{"f":"Prochaine station : Berri-UQAM.","e":"Next station: Berri-UQAM.","r":"hear"},{"f":"Correspondance avec les lignes orange et jaune.","e":"Transfer to the orange and yellow lines.","r":"hear"},{"f":"Veuillez ne pas retenir les portes.","e":"Please do not hold the doors.","r":"hear"},{"f":"Veuillez vous éloigner des portes.","e":"Please stand clear of the doors.","r":"hear"},{"f":"En raison d'un incident, le service est interrompu sur la ligne orange entre les stations Lionel-Groulx et Berri-UQAM.","e":"Due to an incident, service is stopped on the orange line between Lionel-Groulx and Berri-UQAM.","r":"hear","n":"« En raison de » = because of. The key part is the two station names: no trains between them."},{"f":"La reprise du service est prévue vers quinze heures.","e":"Service is expected to resume around 3 pm.","r":"hear"},{"f":"Un service de navettes par autobus est offert.","e":"A replacement shuttle bus service is available.","r":"hear"},{"f":"Le service est maintenant rétabli sur toute la ligne.","e":"Service is now restored on the whole line.","r":"hear"},{"f":"Nous vous remercions de votre patience.","e":"Thank you for your patience.","r":"hear"},{"f":"Terminus. Tous les passagers doivent descendre.","e":"End of the line. All passengers must get off.","r":"hear"}]},{"title":"You'll say","kind":"phrases","items":[{"f":"Je voudrais une carte pour trois jours, s'il vous plaît.","e":"I'd like a 3-day pass, please.","r":"say"},{"f":"C'est quelle direction pour aller au Vieux-Port ?","e":"Which direction to go to the Old Port?","r":"say"},{"f":"Est-ce que je dois changer de ligne ?","e":"Do I have to change lines?","r":"say"},{"f":"C'est quelle sortie pour la rue Sainte-Catherine ?","e":"Which exit for Sainte-Catherine Street?","r":"say"},{"f":"Ma carte ne fonctionne pas.","e":"My card doesn't work.","r":"say"}]},{"title":"You'll see (signs)","kind":"phrases","items":[{"f":"Direction Côte-Vertu","e":"Trains towards Côte-Vertu (orange line terminus)","r":"see"},{"f":"Correspondance","e":"Transfer to another line","r":"see"},{"f":"Sortie","e":"Exit","r":"see"},{"f":"Accès aux quais","e":"To the platforms","r":"see"},{"f":"Ne pas s'appuyer sur les portes","e":"Do not lean on the doors","r":"see"},{"f":"Places réservées","e":"Priority seating","r":"see"},{"f":"Interdit de fumer","e":"No smoking","r":"see"}]}]},{"id":"hostel","title":"Hostel check-in","sub":"five people, one dorm room","intro":"You'll be in « un dortoir » (dorm). Check-in is « l'arrivée » or « l'enregistrement », check-out is « le départ ». Ask about lockers (bring a padlock: « un cadenas »), sheets and towels, and breakfast (« le déjeuner » in Québec!).","tips":["« Le départ est à 11 h » = check-out is at 11 am.","Roommates will likely use « tu » straight away; do the same.","« Le lit du haut / du bas » = top / bottom bunk."],"blocks":[{"title":"Key words","kind":"words","items":[{"f":"l'auberge de jeunesse","e":"youth hostel","pr":"loh·behrzh duh zheu·nehs"},{"f":"la réception","e":"front desk","pr":"la ray·sehp·syõ"},{"f":"la réservation","e":"booking","pr":"la ray·zehr·va·syõ"},{"f":"l'arrivée","e":"check-in (arrival)","n":"Also « l'enregistrement ».","pr":"la·ree·vay"},{"f":"le départ","e":"check-out (departure)","pr":"luh day·par"},{"f":"le dortoir","e":"dorm room","pr":"luh dor·twar"},{"f":"la chambre partagée","e":"shared room","pr":"la shãbr par·ta·zhay"},{"f":"le lit superposé","e":"bunk bed","pr":"luh lee sü·pehr·poh·zay"},{"f":"le casier","e":"locker","pr":"luh ka·zyay"},{"f":"le cadenas","e":"padlock","pr":"luh ka·duh·na"},{"f":"les draps","e":"bed sheets","pr":"leh dra"},{"f":"la serviette","e":"towel","faux":true,"n":"Faux ami: a towel, not a napkin first (napkin = serviette de table).","pr":"la sehr·vyeht"},{"f":"l'oreiller","e":"pillow","pr":"loh·ray·yay"},{"f":"la couverture","e":"blanket","pr":"la koo·vehr·tür"},{"f":"la carte magnétique","e":"key card","pr":"la kart ma·nyay·teek"},{"f":"la salle de bain partagée","e":"shared bathroom","pr":"la sal duh bẽ par·ta·zhay"},{"f":"la douche","e":"shower","n":"RU: душ.","pr":"la doosh"},{"f":"la cuisine commune","e":"shared kitchen","pr":"la küee·zeen koh·mün"},{"f":"le mot de passe","e":"password (Wi-Fi)","pr":"luh moh duh pas"},{"f":"la consigne à bagages","e":"luggage storage","pr":"la kõ·seeny a ba·gazh"},{"f":"le dépôt","e":"deposit (key card, towel)","pr":"luh day·poh"},{"f":"la prise","e":"power outlet","n":"« Une prise de courant » = outlet; « un chargeur » = charger.","pr":"la preez"},{"f":"le bouchon","e":"earplug (bouchon d'oreille); also traffic jam","n":"Two meanings: earplug and traffic jam.","pr":"luh boo·shõ"}]},{"title":"At the front desk — you'll say","kind":"phrases","items":[{"f":"Bonjour, j'ai une réservation au nom de [nom de famille].","e":"Hello, I have a booking under the name [surname].","r":"say"},{"f":"C'est pour quatre nuits, dans un dortoir de cinq personnes.","e":"It's for four nights, in a five-person dorm.","r":"say"},{"f":"À quelle heure est le départ ?","e":"What time is check-out?","r":"say"},{"f":"Est-ce que le déjeuner est inclus ?","e":"Is breakfast included?","r":"say"},{"f":"Est-ce qu'il y a des casiers ?","e":"Are there lockers?","r":"say"},{"f":"Est-ce que je peux louer un cadenas / une serviette ?","e":"Can I rent a padlock / a towel?","r":"say"},{"f":"Quel est le mot de passe du wifi ?","e":"What's the Wi-Fi password?","r":"say"},{"f":"Est-ce que je peux laisser mes bagages ici après le départ ?","e":"Can I leave my luggage here after check-out?","r":"say"},{"f":"La douche ne marche pas.","e":"The shower isn't working.","r":"say"}]},{"title":"At the front desk — you'll hear","kind":"phrases","items":[{"f":"Avez-vous une pièce d'identité ?","e":"Do you have ID?","r":"hear"},{"f":"Je vais avoir besoin de votre passeport.","e":"I'll need your passport.","r":"hear"},{"f":"Il reste un montant à payer de…","e":"There's a balance remaining of…","r":"hear"},{"f":"Il y a un dépôt de vingt dollars pour la carte.","e":"There's a $20 deposit for the key card.","r":"hear"},{"f":"Votre chambre est au troisième étage, lit numéro deux.","e":"Your room is on the third floor, bed number two.","r":"hear","n":"Québec counts floors like North America: 1er étage = ground floor."},{"f":"Les draps sont sur le lit.","e":"The sheets are on the bed.","r":"hear"},{"f":"Le déjeuner est servi de sept heures à dix heures.","e":"Breakfast is served from 7 to 10.","r":"hear"},{"f":"Les heures de silence sont de 23 h à 7 h.","e":"Quiet hours are from 11 pm to 7 am.","r":"hear"}]},{"title":"With your roommates","kind":"phrases","items":[{"f":"Salut ! Moi, c'est [prénom]. Toi, c'est quoi ton nom ?","e":"Hi! I'm [first name]. What's your name?","r":"say"},{"f":"Tu viens d'où ?","e":"Where are you from?","r":"hear"},{"f":"C'est ton lit ?","e":"Is this your bed?","r":"say"},{"f":"Je prends le lit du haut, ça te va ?","e":"I'll take the top bunk, is that OK?","r":"say"},{"f":"Est-ce que je peux éteindre la lumière ?","e":"Can I turn off the light?","r":"say"},{"f":"Désolé, je ne voulais pas te réveiller.","e":"Sorry, I didn't mean to wake you.","r":"say"},{"f":"Je pars tôt demain matin.","e":"I'm leaving early tomorrow morning.","r":"say"},{"f":"Tu as un chargeur ?","e":"Do you have a charger?","r":"say"},{"f":"On va prendre une bière, tu viens ?","e":"We're going for a beer, are you coming?","r":"hear"}]}]},{"id":"museum","title":"Buying museum tickets","sub":"billets, rates, coat check","intro":"At the ticket desk (« la billetterie ») you'll choose a rate (« tarif »), and between the permanent collection and a temporary exhibition. In winter, use « le vestiaire » (coat check): many museums require large bags and coats to be left there.","tips":["Ask « Est-ce qu'il y a un tarif réduit ? » — reduced rates exist for students, youth and seniors; bring the ID.","« L'exposition temporaire » often costs extra; « la collection permanente » is the regular galleries.","« Gratuit » = free; « complet » = sold out."],"blocks":[{"title":"Key words","kind":"words","items":[{"f":"le musée","e":"museum","pr":"luh mü·zay"},{"f":"la billetterie","e":"ticket office","pr":"la bee·yeh·tuh·ree"},{"f":"le billet","e":"ticket","pr":"luh bee·yeh"},{"f":"le tarif","e":"rate, price category","n":"tarif adulte / étudiant / réduit.","pr":"luh ta·reef"},{"f":"l'entrée","e":"admission; entrance","n":"« L'entrée est gratuite » = admission is free.","pr":"lã·tray"},{"f":"gratuit","e":"free (no cost)","pr":"gra·tüee"},{"f":"l'exposition","e":"exhibition","n":"Often shortened to « l'expo ».","pr":"lehk·spoh·zee·syõ"},{"f":"la collection permanente","e":"permanent collection","pr":"la koh·lehk·syõ pehr·ma·nãt"},{"f":"le vestiaire","e":"coat check, cloakroom","pr":"luh vehs·tyehr"},{"f":"l'audioguide","e":"audio guide","pr":"loh·dyoh·geed"},{"f":"le plan","e":"map (of the museum)","pr":"luh plã"},{"f":"la salle","e":"gallery room","pr":"la sal"},{"f":"l'étage","e":"floor, level","pr":"lay·tazh"},{"f":"la visite guidée","e":"guided tour","pr":"la vee·zeet gee·day"},{"f":"l'œuvre","e":"work of art","pr":"leuvr"},{"f":"le tableau","e":"painting","faux":true,"n":"Faux ami: not a table; « tableau » = painting (also board).","pr":"luh ta·bloh"},{"f":"la boutique","e":"gift shop","pr":"la boo·teek"},{"f":"le casier","e":"locker","pr":"luh ka·zyay"}]},{"title":"You'll say","kind":"phrases","items":[{"f":"Un billet adulte, s'il vous plaît.","e":"One adult ticket, please.","r":"say"},{"f":"Est-ce qu'il y a un tarif étudiant ?","e":"Is there a student rate?","r":"say"},{"f":"Est-ce que l'exposition temporaire est incluse ?","e":"Is the temporary exhibition included?","r":"say"},{"f":"Où est le vestiaire ?","e":"Where is the coat check?","r":"say"},{"f":"Est-ce qu'on peut prendre des photos ?","e":"Can we take photos?","r":"say"},{"f":"Le musée ferme à quelle heure ?","e":"What time does the museum close?","r":"say"}]},{"title":"You'll hear","kind":"phrases","items":[{"f":"C'est pour la collection ou pour l'exposition ?","e":"Is it for the collection or the exhibition?","r":"hear"},{"f":"Avez-vous une carte étudiante ?","e":"Do you have a student card?","r":"hear"},{"f":"Les sacs à dos doivent être laissés au vestiaire.","e":"Backpacks must be left at the coat check.","r":"hear"},{"f":"Le musée ferme dans quinze minutes.","e":"The museum closes in fifteen minutes.","r":"hear"},{"f":"Gardez votre billet, il est valide toute la journée.","e":"Keep your ticket, it's valid all day.","r":"hear"}]},{"title":"You'll see (signs)","kind":"phrases","items":[{"f":"Billetterie","e":"Tickets","r":"see"},{"f":"Photos sans flash seulement","e":"Photos without flash only","r":"see"},{"f":"Prière de ne pas toucher","e":"Please do not touch","r":"see"},{"f":"Début de l'exposition","e":"Exhibition starts here","r":"see"},{"f":"Entrée libre","e":"Free admission","r":"see"}]}]},{"id":"concert","title":"Going to a concert","sub":"« un spectacle » or simply « un show »","intro":"In Québec people say « un show » as often as « un spectacle ». Check « l'ouverture des portes » (doors) on your ticket, and whether you're « debout » (standing, usually « le parterre ») or « assis » (seated, with section / rangée / siège).","tips":["« La première partie » is the opening act, not the first half. « Le rappel » is the encore — shout « Une autre ! » for one more song.","Bars and venues check ID: legal drinking age in Québec is 18. « Une consommation » = a drink.","Your e-ticket's QR code is « le code QR » (said « ku-air »)."],"blocks":[{"title":"Key words","kind":"words","items":[{"f":"le spectacle","e":"show, concert, performance","pr":"luh spehk·takl"},{"f":"le show","e":"show, gig","qc":true,"pr":"luh shoh"},{"f":"la salle de spectacle","e":"concert hall, venue", ed.","r":"hear"},{"f":"Le spectacle commence dans cinq minutes.","e":"The show starts in five minutes.","r":"hear"},{"f":"C'est complet pour ce soir.","e":"It's sold out tonight.","r":"hear"},{"f":"Une autre ! Une autre !","e":"One more! (the crowd asking for an encore)","r":"hear"}]},{"title":"You'll see (signs)","kind":"phrases","items":[{"f":"Ouverture des portes : 19 h — Spectacle : 20 h","e":"Doors 7 pm — show 8 pm","r":"see"},{"f":"Billetterie","e":"Box office","r":"see"},{"f":"Parterre debout / Balcon","e":"Standing floor / Balcony","r":"see"},{"f":"Interdit aux moins de 18 ans","e":"No one under 18","r":"see"},{"f":"Sortie de secours","e":"Emergency exit","r":"see"}]}]}]}</script>
